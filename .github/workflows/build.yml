# Fast payload and NR-loader smoke tests on every push and pull request.
# Product compilation happens during release packaging; tools/ci.ps1 -Full is opt-in.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, pinned source
      - name: Fast smoke tests
        timeout-minutes: 3
        shell: pwsh
        run: powershell -NoProfile -File tools/ci.ps1
