# Builds the manager, the installer and the sample addon, and runs the tests that need no GPU and no game, on every push and pull request.
# Neural Rendering is built without the proprietary model or SDK. Hardware tests are run separately.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, pinned source
      - name: Build and test
        shell: pwsh
        run: powershell -NoProfile -File tools/ci.ps1
